<!DOCTYPE html> 
<html lang ="en">
    <head> 
        <meta charset = "UTF-8">
        <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
        <title>Recipe Details</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    </head>
    <body>
        <main class="container" id="recipe-detail">
            <p>Loading recipe details...</p>
        </main>

        <script> 
            const id = window.location.pathname.split('/').pop();

            fetch(`/api/recipes/${id}`)
            .then(res => res.json())
            .then(recipe => {
                document.getElementById('recipe-detail').innerHTML = `
                    <article> 
                        <header> 
                            <h1>${recipe.title}</h1>
                            <p><em>${recipe.cuisine} • Prep: ${recipe.prepTime} • Difficulty: ${recipe.difficulty}</em></p>
                        </header>
                        <div class="grid">
                            <div> 
                                <img src="${recipe.image}" alt="${recipe.title} image" style="max-width: 100%;">
                            </div>
                            <div> 
                                <h2>Ingredients</h2>
                                <ul>
                                    ${recipe.ingredients.map(ingredient => `<li>${ingredient}</li>`).join('')}
                                </ul>
                            </div> 
                        </div>
                            <section style="margin-top: 2rem;"> 
                                <h2>Instructions</h2>
                                <p>${recipe.instructions}</p>
                            </section>
                            <footer> 
                                <a href="/" role="button" class="secondary">Back to Recipes</a>
                            </footer>
                        </article>
                `;
            }); 
        </script>
    </body>>
</html>
